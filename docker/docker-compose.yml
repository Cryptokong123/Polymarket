version: '3.8'

services:
  # Python Research Layer - Signal Generation
  research:
    build:
      context: ..
      dockerfile: docker/Dockerfile.research
    container_name: polymarket-research
    environment:
      - POLYGON_WALLET_PRIVATE_KEY=${POLYGON_WALLET_PRIVATE_KEY}
      - WALLET_ADDRESS=${WALLET_ADDRESS}
      - CLOB_API_URL=${CLOB_API_URL:-https://clob.polymarket.com}
      - GAMMA_API_URL=${GAMMA_API_URL:-https://gamma-api.polymarket.com}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-claude-3-5-sonnet-20241022}
      - MIN_EXPECTED_VALUE=${MIN_EXPECTED_VALUE:-0.05}
      - MAX_POSITION_SIZE=${MAX_POSITION_SIZE:-100}
      - MAX_POSITIONS=${MAX_POSITIONS:-10}
      - MIN_LIQUIDITY=${MIN_LIQUIDITY:-1000}
      - SCAN_INTERVAL=${SCAN_INTERVAL:-300}
      - NEWSAPI_KEY=${NEWSAPI_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DRY_RUN=${DRY_RUN:-false}
    volumes:
      - ../shared:/app/shared
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - polymarket-net

  # TypeScript Executor Layer - Trade Execution
  executor:
    build:
      context: ..
      dockerfile: docker/Dockerfile.executor
    container_name: polymarket-executor
    environment:
      - POLYGON_WALLET_PRIVATE_KEY=${POLYGON_WALLET_PRIVATE_KEY}
      - WALLET_ADDRESS=${WALLET_ADDRESS}
      - CLOB_API_URL=${CLOB_API_URL:-https://clob.polymarket.com}
      - MAX_POSITIONS=${MAX_POSITIONS:-10}
      - MAX_SLIPPAGE=${MAX_SLIPPAGE:-0.02}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DRY_RUN=${DRY_RUN:-false}
    volumes:
      - ../shared:/app/shared
      - ../data:/app/data
    depends_on:
      research:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - polymarket-net

  # Optional: Redis for signal queue (more robust than file watching)
  redis:
    image: redis:7-alpine
    container_name: polymarket-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - polymarket-net
    profiles:
      - with-redis

networks:
  polymarket-net:
    driver: bridge

volumes:
  redis_data:
    driver: local
